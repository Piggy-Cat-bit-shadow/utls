name: Go macOS arm64 1.27

# The full Go matrix includes macOS arm64 through macos-15, but that job has
# repeatedly been cancelled or starved behind older entries in the shared
# macos-latest queue. This dispatch-only, single-job check gives the Go 1.27
# arm64 slice its own run so it can be re-verified without scheduling 39 other
# jobs. It uses the same go.mod, CGO_ENABLED and GOTOOLCHAIN settings as the
# matrix entry.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: 0
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
      - name: Go version
        run: go version
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
